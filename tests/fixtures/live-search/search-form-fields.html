<!-- Sanitized from Find a Grave's memorial search form on 2026-08-19. -->
<form id="general-search">
  <input name="fulltext">
  <input name="bio">
  <input name="memorialid">
  <input name="tags" value="american revolutionary war">
  <select name="birthyearfilter">
    <option value="exact"></option><option value="before"></option>
    <option value="after"></option><option value="1"></option>
    <option value="3"></option><option value="5"></option>
    <option value="10"></option><option value="25"></option>
    <option value="unknown"></option>
  </select>
  <select name="datefilter">
    <option value="1"></option><option value="7"></option>
    <option value="30"></option><option value="90"></option>
    <option value="-90"></option>
  </select>
  <select name="orderby">
    <option value="r"></option><option value="n"></option>
    <option value="n-"></option><option value="b"></option>
    <option value="b-"></option><option value="d"></option>
    <option value="d-"></option><option value="c"></option>
    <option value="c-"></option><option value="dc"></option>
    <option value="dm"></option><option value="pl"></option>
  </select>
</form>
