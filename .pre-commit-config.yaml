repos:
  # Vale v3.22.0. The immutable revision keeps local and CI behavior aligned.
  - repo: https://github.com/vale-cli/vale
    rev: e109c06297dc58a513f10691a275f3a9465584a1
    hooks:
      - id: vale
        alias: vale
        name: Vale documentation style
        files: \.md$
        exclude: ^maintenance/vale-fixtures/fail\.md$
        stages: [manual]
      - id: vale
        alias: vale-version
        name: Vale pinned-source executable
        entry: vale --version
        pass_filenames: false
        stages: [manual]
      - id: vale
        alias: vale-fixture
        name: Vale documentation rule fixtures
        stages: [manual]
  - repo: local
    hooks:
      - id: documentation-style
        name: Documentation style policy
        entry: uv run --locked --group dev python maintenance/check_documentation_style.py
        language: system
        pass_filenames: false
        always_run: true
      - id: black
        name: Black check
        entry: uv run --locked --group dev black --check
        language: system
        types: [python]
      - id: ruff
        name: Ruff lint
        entry: uv run --locked --group dev ruff check
        language: system
        types: [python]
      - id: mypy-application
        name: Mypy application boundary
        entry: uv run --locked --group dev mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: application-docstrings
        name: Application docstrings
        entry: uv run --locked --group dev ruff check --select D --ignore D105,D107 src/graver/acquisition.py src/graver/application.py src/graver/database.py src/graver/errors.py src/graver/evidence.py src/graver/progress.py src/graver/research.py src/graver/workspace.py
        language: system
        pass_filenames: false
        types: [python]
