name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group test --group dev
      - run: uv run pytest

  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.14"
      - run: uv lock --check
      - run: uv sync --locked --group test --group dev
      - run: uv run black --check src/graver tests
      - run: uv build
      - name: Verify the built wheel
        shell: bash
        run: |
          wheel_path=$(find dist -name '*.whl' -print -quit)
          uv run --isolated --no-project --with "$wheel_path" python -c \
            "import graver, tomllib; from importlib.metadata import version; expected = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; assert version('graver') == expected"

  platform:
    name: ${{ matrix.os }} / Python 3.14
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.14"
      - run: uv sync --locked --group test --group dev
      - name: Run tests
        if: runner.os != 'Windows'
        run: uv run pytest
      - name: Run tests with slow-test report
        if: runner.os == 'Windows'
        run: uv run pytest --durations=25
