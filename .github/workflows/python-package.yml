name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group test --group dev
      - run: uv run pytest

  coverage:
    name: Branch coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.14"
      - run: uv sync --locked --group test
      - name: Measure branch coverage
        run: uv run pytest --cov=graver --cov-report=term-missing --cov-report=xml
      - name: Publish coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          file: coverage.xml
          format: cobertura
          github-token: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.14"
      - run: uv lock --check
      - run: uv sync --locked --group test --group dev
      - run: uv run black --check src/graver tests review consumer_spike
      - run: uv run ruff check src/graver tests review consumer_spike
      - run: uv run mypy
      - run: uv run ruff check --select D --ignore D105,D107 src/graver/acquisition.py src/graver/application.py src/graver/database.py src/graver/errors.py src/graver/evidence.py src/graver/progress.py src/graver/research.py src/graver/workspace.py
      - run: uv build
      - name: Verify the built wheel
        shell: bash
        run: |
          wheel_path=$(find dist -name '*.whl' -print -quit)
          uv run --isolated --no-project --with "$wheel_path" python -c \
            "import graver, graver.application as application, tomllib; from importlib.metadata import version; expected = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; assert version('graver') == expected; assert 'open_workspace' in application.__all__"
          uv run --isolated --no-project --with "$wheel_path" graver --version
          uv run --isolated --no-project --with "$wheel_path" python -m graver --version
          tool_directory="$RUNNER_TEMP/graver-uv-tool"
          tool_bin_directory="$RUNNER_TEMP/graver-uv-tool-bin"
          UV_TOOL_DIR="$tool_directory" UV_TOOL_BIN_DIR="$tool_bin_directory" \
            uv tool install "$wheel_path"
          "$tool_bin_directory/graver" --version
          consumer_database="$RUNNER_TEMP/graver-consumer-spike.db"
          uv run --isolated --no-project --with "$wheel_path" python \
            consumer_spike/workspace_client.py "$consumer_database"

  platform:
    name: ${{ matrix.os }} / Python 3.14
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.14"
      - run: uv sync --locked --group test --group dev
      - name: Run tests
        if: runner.os != 'Windows'
        run: uv run pytest
      - name: Run tests with slow-test report
        if: runner.os == 'Windows'
        run: uv run pytest --durations=25
