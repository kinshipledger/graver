[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[project]
name = "graver"
version = "0.1.0"
description = ""
authors = [{ name = "Larry McQueary", email = "contact@mcqueary.org" }]
requires-python = ">=3.11"
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "beautifulsoup4==4.12.2",
    "tqdm==4.66.1",
    "typer[all]>=0.9.0,<0.10",
    "click>=8.1,<8.2",
    "requests>=2.31,<3",
    "dill>=0.3.7,<0.4",
    "types-python-dateutil>=2.8.19.14,<3",
    "betamax>=0.8.1",
    "pytest>=7.4.4",
    "faker>=21.0.1",
]

[project.scripts]
graver = "graver.cli:app"

[dependency-groups]
test = [
    "coverage",
    "coveralls>=3.3.1,<4",
    "flake8>=6.1.0,<7",
    "pytest>=7.4.3,<8",
    "pytest-cov>=4.1.0,<5",
    "pytest-helpers-namespace>=2021.12.29,<2022",
    "pytest-integration>=0.2.3,<0.3",
    "requests-mock>=1.11.0,<2",
    "betamax>=0.8.1,<0.9",
    "faker>=21.0.0,<22",
]
dev = [
    "black>=23.11.0,<24",
    "isort>=5.12.0,<6",
    "pre-commit>=3.5.0,<4",
    "mypy>=1.7.1,<2",
    "types-beautifulsoup4>=4.12.0.7,<5",
    "types-tqdm>=4.66.0.5,<5",
    "deadcode>=2.2.2,<3",
    "types-requests>=2.31.0.10,<3",
]

[tool.deadcode]
exclude = [".venv", ".tox", ".trunk", "tests"]
ignore-names = ["BaseTestCase", "*Mixin"]
ignore-names-in-files = ["migrations"]


[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:betamax.*"]
