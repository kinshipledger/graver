[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project]
name = "graver-genealogy"
version = "1.0.0-rc.1"
description = "Build provenance-aware genealogical research from cemetery memorials"
authors = [{ name = "Larry McQueary", email = "contact@mcqueary.org" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "tqdm>=4.66.3,<5",
    "typer>=0.12,<1",
    "requests>=2.33,<3",
]

[project.urls]
Homepage = "https://github.com/kinshipledger/graver"
Documentation = "https://github.com/kinshipledger/graver/tree/main/docs"
Issues = "https://github.com/kinshipledger/graver/issues"
Repository = "https://github.com/kinshipledger/graver"
Changelog = "https://github.com/kinshipledger/graver/blob/main/CHANGELOG.md"

[project.scripts]
graver = "graver.cli:app"

[tool.uv.build-backend]
module-name = "graver"

[dependency-groups]
test = [
    "click>=8.1,<9",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-helpers-namespace>=2021.12.29,<2022",
    "pytest-socket>=0.8,<1",
    "packaging>=24,<27",
    "python-dateutil>=2.9,<3",
    "requests-mock>=1.11.0,<2",
    "betamax>=0.8.1,<1",
    "faker>=21",
]
dev = [
    "black>=24.3,<27",
    "pip-audit>=2.10.1,<3",
    "ruff>=0.14,<1",
    "pre-commit>=3.5.0,<5",
    "mypy>=2.3.1,<3",
    "types-beautifulsoup4>=4.12.0.7,<5",
    "types-tqdm>=4.66.0.5,<5",
    "types-requests>=2.31.0.10,<3",
]

[tool.black]
target-version = ["py311", "py312", "py313", "py314"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008", "B904"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
files = [
    "src/graver/acquisition.py",
    "src/graver/application.py",
    "src/graver/database.py",
    "src/graver/evidence.py",
    "src/graver/evidence_packet.py",
    "src/graver/evidence_projection.py",
    "src/graver/errors.py",
    "src/graver/progress.py",
    "src/graver/research.py",
    "src/graver/workspace.py",
]
python_version = "3.11"
follow_imports = "skip"
check_untyped_defs = true
disallow_untyped_defs = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--disable-socket"]
strict_markers = true
markers = [
    "unit: isolated domain behavior without storage or recorded HTTP",
    "integration: multiple graver components using isolated local resources",
    "recorded: sanitized replay-only provider interaction; never records or contacts live services",
    "slow: deliberately longer maintenance test excluded only by an explicit workflow",
]
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::DeprecationWarning:typer.*",
    "ignore::DeprecationWarning:betamax.*",
]

[tool.coverage.run]
branch = true
source = ["graver"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"
